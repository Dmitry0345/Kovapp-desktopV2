# ===== проверка вёрстки =====
audit:
  interactive: "button, a[href], input:not([type=hidden]):not([type=file]), select, textarea, [role=button]"
  ignore:
    - "#kov-toasts"
    - ".link-bar"
    - ".dl-panel"
    - ".scrim"
    - ".side-menu:not(.open)"
    - ".side-panel:not(.open)"
    - ".login-bg"
  containers:
    - ".card"
    - ".modal"
    - ".file-tile"
    - ".info-card"
    - ".login-card"
    - ".top-bar"
    - ".profile-panel"
    - ".folder-card"
    - ".viewer-top"
    - ".tile-actions"
    - ".btn-row"
  allow_overflow:
    - ".badge"
    - ".count"
    - ".lock-mark"
    - ".tile-play"
    - ".chip-x"
    - ".spinner"
    - "[data-tooltip]"
  text_clip: ".tile-name, .title-chip, .chip, .btn, td, th, .name, .t"
  overlays:
    - ".side-menu.open"
    - ".side-panel.open"
    - ".viewer-root"
    - ".modal-root"
    - ".kov-sheet-root"   # шторки снизу на телефоне (фильтры, меню файла, выбор из списка)
  allowed_console:
    - "WebSocket connection"
    - "Failed to load resource: the server responded with a status of 404"
    - "Failed to load resource: the server responded with a status of 415"
    - "favicon"
    - "interactive-widget"
    - "Push API in incognito"
  allowed_http:
    - "404 /employees/\\d+/photo"
    - "404 /.*/thumb"
    - "415 /.*"

