# ===== безопасный обход кнопок =====
crawler:
  skip_text:
    - Пример кнопки
    - Удалить
    - Выйти
    - Выход
    - Сохранить
    - Отправить
    - Завершить
    - Возобновить
    - Продолжить задачу
    - Вернуть в работу
    - Выдать
    - Подтвердить
    - Отклонить
    - Отменить
    - Применить
    - Импорт
    - Загрузить
    - Добавить файлы
    - Сменить фото
  skip_selector:
    - ".danger"
    - ".menu-btn"
    - ".bell-btn"
    - "input[type=file]"
  max_buttons: 40
  roles: [director, head_mont, worker_mont]
  combos: [light-desktop, dark-mobile]

# ===== кто смотрит разделы при проверке вёрстки =====
visual:
  roles: [director, head_mont, worker_mont, worker_buh, contract1, stock]

# ===== доступ к разделам меню =====
access:
  projects_hidden_for: [worker_mont, worker_mont2, worker_to]
  csv_only: [admin, director]
