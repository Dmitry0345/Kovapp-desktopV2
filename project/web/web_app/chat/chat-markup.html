<div class="drag-overlay" id="dragOverlay">
        <div class="drag-icon">📁</div>
        <div>Отпустите файлы для отправки</div>
    </div>

    <div class="app-container">
        
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="railBtn" class="icon-btn rail-btn" title="Свернуть список чатов" type="button">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
                </button>
                <input type="text" id="chatSearchInput" placeholder="Поиск по чатам…" aria-label="Поиск по чатам">
                <button id="addChatBtn" class="icon-btn" title="Добавить чат">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
            <div id="connectionBar" class="connection-bar" style="display: none;"></div>
            <div class="chat-list-container" id="chatListContainer">
                
            </div>
        </div>

        
        <div class="chat-main" id="chatMainPanel">
            
            <div id="placeholder" class="placeholder">
                Выберите чат для начала общения
            </div>

            <div class="chat-area" id="chatArea" style="display: none;">
                
                <div class="chat-header" id="chatHeader" style="cursor: pointer;" title="Показать информацию">
                    <button id="kovChatBack" class="icon-btn" title="К списку чатов"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
                    <!-- Обработчик навешивается из chat.js: политика содержимого сервера
                         (script-src 'self') запрещает обработчики в атрибутах,
                         и нажатие по шапке молча не срабатывало -->
                    <div class="chat-header-info-clickable" id="chatHeaderInfo" role="button" tabindex="0" title="Показать информацию" style="display: flex; align-items: center; gap: 12px;">
                        <div class="chat-avatar" id="headerAvatar"></div>
                        <div class="chat-title-box">
                            <div class="chat-title" id="headerTitle">Unknown</div>
                            <!-- число участников группы или должность собеседника -->
                            <div class="chat-subtitle" id="headerSub" hidden></div>
                        </div>
                    </div>
                    <div class="header-spacer"></div>
                    <button id="btnSearchChat" class="icon-btn" style="display: none;" title="Поиск в чате">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                    
                </div>

                
                <div class="message-list-container" id="messageListContainer">
                    <div id="messagesList" class="messages-list">
                        
                    </div>
                    <button id="scrollToBottomBtn" class="scroll-bottom-btn" title="К последним сообщениям" aria-label="К последним сообщениям">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                </div>

                
                <div class="info-panel" id="infoPanel" style="display: none;">
                    <div class="reply-container" id="replyContainer" style="display: none;">
                        <div id="replyInfo" class="reply-info">Ответ...</div>
                        <button id="btnCloseReply" class="icon-btn-small">✕</button>
                    </div>
                    <div class="attachments-container" id="attachmentsContainer" style="display: none;">
                        
                    </div>
                </div>

                
                <div class="upload-progress-container" id="uploadProgressContainer" style="display: none;">
                    <div class="upload-progress-bar" id="uploadProgressBar" style="width: 0%;"></div>
                    <div class="upload-progress-text" id="uploadProgressText">0%</div>
                </div>

                
                <div class="input-area">
                    <button id="btnAttach" class="icon-btn" title="Прикрепить файл">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    <div class="input-wrapper">
                        <textarea id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
                        <div id="charCounter" class="char-counter" style="display: none;">Осталось: 4096</div>
                    </div>
                    <button id="btnEmoji" class="icon-btn emoji-btn" title="Эмодзи, стикеры и GIF" type="button">
                        <!-- Клавиатура: на телефоне подменяет смайлик, когда панель
                             открыта, — нажатие возвращает клавиатуру -->
                        <svg class="kbd-glyph" viewBox="0 0 24 24" width="24" height="24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9.5 14h5"></path>
                        </svg>
                        <svg class="smile-glyph" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2"></path>
                            <path d="M9 9.6v.1"></path><path d="M15 9.6v.1"></path>
                        </svg>
                    </button>
                    <button id="btnSend" class="send-btn" title="Отправить">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>

        
        <div class="search-sidebar" id="searchSidebar">
            <div class="search-sidebar-header">
                <span class="search-sidebar-title">Поиск в чате</span>
                <button id="btnCloseSearchSidebar" class="close-search-btn">✖</button>
            </div>
            <input type="text" id="messageSearchInput" class="message-search-input" placeholder="Искать в чате...">
            <hr class="search-divider">
            <div class="search-results-list" id="searchResultsList">
                
            </div>
        </div>

        <!-- Панель эмодзи, стикеров и GIF: выезжает справа, как поиск -->
        <div class="media-sidebar" id="mediaSidebar" aria-hidden="true">
            <div class="media-sidebar-header">
                <div class="media-tabs" id="mediaTabs">
                    <button class="media-tab on" data-tab="emoji" type="button">Эмодзи</button>
                    <button class="media-tab" data-tab="stickers" type="button">Стикеры</button>
                    <button class="media-tab" data-tab="gif" type="button">GIF</button>
                </div>
                <button id="btnCloseMediaSidebar" class="close-search-btn" title="Закрыть">✖</button>
            </div>
            <div class="media-body" id="mediaBody"></div>
        </div>

    </div>
