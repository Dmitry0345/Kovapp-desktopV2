# ===== как на рабочем сервере: /ws/ — переписке, загрузки — процессам приёма, чтения — процессам чтения, остальное — API =====
upstream kovapp_api  { server 127.0.0.1:54545; keepalive 32; }
upstream kovapp_rt   { server 127.0.0.1:54546; }
upstream kovapp_read { server 127.0.0.1:54547; keepalive 64; }
upstream kovapp_upload { server 127.0.0.1:54548; keepalive 32; }

map "$request_method:$uri" $kovapp_backend {
    default                                                        kovapp_api;
    "~^GET:/(upload/progress|push/test|health)"                    kovapp_api;
    "~^[A-Z]+:/uploads/"                                           kovapp_upload;
    "~^POST:/(upload|chat/upload|chat/grouped-message|projects/[0-9]+/files)$"  kovapp_upload;
    "~^(GET|HEAD):"                                                kovapp_read;
}

server {
    listen 83.171.90.230:54545;  # ваш внешний адрес и порт
    client_max_body_size 2g;
    client_body_buffer_size 4m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types application/json text/plain text/css text/xml application/xml application/javascript image/svg+xml;

    location /ws/ {
        proxy_pass http://kovapp_rt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://$kovapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
